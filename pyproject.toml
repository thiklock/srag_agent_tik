[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srag-agent"
version = "0.1.0"
description = "GenAI agent that generates an SRAG (severe acute respiratory syndrome) report from Open DATASUS data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "httpx>=0.27",
  "pydantic>=2.6",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[project.scripts]
srag = "srag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
